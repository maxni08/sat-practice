[package]
name = "sat-practice"
version = "1.5.0"
description = "Focused local SAT question practice"
edition = "2021"
rust-version = "1.88"

[lib]
name = "sat_practice_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
base64 = "0.22"
csv = "1.3"
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
