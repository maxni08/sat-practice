name: Publish Windows 1.5.0 release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-publish:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stable-1.5.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Windows installers
        run: node scripts/desktop.mjs build --bundles nsis,msi
      - name: Prepare release assets and notes
        shell: pwsh
        run: |
          $assets = 'release-assets'
          New-Item -ItemType Directory -Force $assets | Out-Null
          $nsis = Get-ChildItem 'src-tauri/target/release/bundle/nsis' -Filter '*1.5.0*x64-setup.exe' | Select-Object -First 1
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi' -Filter '*1.5.0*x64_en-US.msi' | Select-Object -First 1
          $app = 'src-tauri/target/release/sat-practice.exe'
          if (-not $nsis -or -not $msi -or -not (Test-Path $app)) { throw 'Expected 1.5.0 NSIS, MSI, and application EXE were not produced.' }
          Copy-Item $nsis.FullName "$assets/SAT Practice_1.5.0_x64-setup.exe"
          Copy-Item $msi.FullName "$assets/SAT Practice_1.5.0_x64_en-US.msi"
          Copy-Item $app "$assets/SAT Practice_1.5.0_x64.exe"
          @'
          ## Extensible Question Library

          - Added `.satpack` support and dynamic external question sources with a Question Sources manager and filtering.
          - Added manual questions and stable source/question identities that preserve study history.
          - Preserved the 3,770 built-in validated questions.

          ## Usability

          - Added global Escape navigation for dismissible layers.
          - Refreshed the interface with clearer hierarchy, responsive layouts, and refined interactions.

          External PDF banks must be converted to the supported pack format; arbitrary PDFs are not imported directly.
          '@ | Set-Content -Encoding utf8 release-notes.md
      - name: Publish release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'stable-1.5.0'
          $repo = $env:GITHUB_REPOSITORY
          gh release view $tag --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $repo --title 'SAT Practice 1.5.0' --notes-file release-notes.md --latest
          } else {
            gh release edit $tag --repo $repo --title 'SAT Practice 1.5.0' --notes-file release-notes.md --latest
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tag (Get-ChildItem release-assets -File | Select-Object -ExpandProperty FullName) --repo $repo --clobber
